<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Log in - Solo2Squad</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="trip.css" />
    <link rel="stylesheet" href="ecosystem.css" />
    <link rel="stylesheet" href="holiday.css" />

  <body class="t">
    <header class="nav" id="nav"></header>

    <div class="form-container tf narrow">
      <div class="tf-head">
        <div>
          <h2>Welcome back</h2>
          <p>Pick up where you left off.</p>
        </div>
        <svg class="tf-plane" viewBox="0 0 72 30" aria-hidden="true"><path d="M7 13 3 2h8l8 11z" fill="#ff6b3d" stroke="#12213a" stroke-width="2" stroke-linejoin="round"/><path d="M3 16c0-3 5-6 12-6h36c10 0 19 3 19 6s-9 6-19 6H15C8 22 3 19 3 16z" fill="#fff" stroke="#12213a" stroke-width="2" stroke-linejoin="round"/><path d="M30 17 21 29h10l15-12z" fill="#ffc93c" stroke="#12213a" stroke-width="2" stroke-linejoin="round"/><path d="M55 12h7c3 1 6 2 6 4H55z" fill="#7cc7e6"/><circle cx="24" cy="16" r="1.8" fill="#12213a"/><circle cx="31" cy="16" r="1.8" fill="#12213a"/><circle cx="38" cy="16" r="1.8" fill="#12213a"/><circle cx="45" cy="16" r="1.8" fill="#12213a"/></svg>
      </div>
      <div class="tf-body">
        <div class="tf-grid" style="grid-template-columns:1fr">
        <label class="fld full"><span class="lb"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>Email address</span>
          <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" /></label>
        <label class="fld full"><span class="lb"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Password</span>
          <input type="password" id="loginPassword" placeholder="Your password" autocomplete="current-password" /></label>
        </div>
        <button id="loginBtn" class="go-btn">Log in <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        <p class="form-link">New here? <a href="register.html">Create an account</a></p>
      </div>
    </div>

    <script type="module" src="ui.js"></script>
    <script type="module" src="script.js"></script>
      <script src="ecosystem.js" defer></script>
    <script src="holiday.js" defer></script>
