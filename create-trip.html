<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Trip - Solo2Squad</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="trip.css">
    <link rel="stylesheet" href="ecosystem.css" />
    <link rel="stylesheet" href="holiday.css" />

</head>

<body class="t">


<header class="nav" id="nav"></header>


<div class="form-container tf">
      <div class="tf-head">
        <div>
          <h2>Create a trip</h2>
          <p>Set the plan, then find people who want to come along.</p>
        </div>
        <svg class="tf-plane" viewBox="0 0 72 30" aria-hidden="true"><path d="M7 13 3 2h8l8 11z" fill="#ff6b3d" stroke="#12213a" stroke-width="2" stroke-linejoin="round"/><path d="M3 16c0-3 5-6 12-6h36c10 0 19 3 19 6s-9 6-19 6H15C8 22 3 19 3 16z" fill="#fff" stroke="#12213a" stroke-width="2" stroke-linejoin="round"/><path d="M30 17 21 29h10l15-12z" fill="#ffc93c" stroke="#12213a" stroke-width="2" stroke-linejoin="round"/><path d="M55 12h7c3 1 6 2 6 4H55z" fill="#7cc7e6"/><circle cx="24" cy="16" r="1.8" fill="#12213a"/><circle cx="31" cy="16" r="1.8" fill="#12213a"/><circle cx="38" cy="16" r="1.8" fill="#12213a"/><circle cx="45" cy="16" r="1.8" fill="#12213a"/></svg>
      </div>
      <div class="tf-body">
        <div class="tf-grid">
        <label class="fld full"><span class="lb"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Trip name</span>
          <input type="text" id="tripName" placeholder="Manali with the squad"></label>
        <label class="fld"><span class="lb"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Destination</span>
          <input type="text" id="destination" placeholder="Where are you headed?"></label>
        <label class="fld"><span class="lb"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Date</span>
          <input type="date" id="tripDate"></label>
        <div class="fld full"><span class="lb"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Travel type</span>
          <select id="tripType"><option value="">Select Travel Type</option><option value="Adventure">Adventure</option><option value="Beach">Beach</option><option value="Road Trip">Road Trip</option><option value="Trekking">Trekking</option><option value="Cultural">Cultural</option><option value="Relaxation">Relaxation</option></select></div>
        <label class="fld"><span class="lb"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/></svg>Maximum members</span>
          <input type="number" id="members" placeholder="2 to 20" min="2" max="20"></label>
        <label class="fld"><span class="lb"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>Cover image</span>
          <input type="url" id="imageUrl" placeholder="Paste an image link (optional)"></label>
        <label class="fld full"><span class="lb"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v13H8l-4 4zM8 9h8M8 13h5"/></svg>About the trip</span>
          <textarea id="description" placeholder="Plans, pace, budget, who you are looking for..."></textarea></label>
        </div>
        <button id="createTripBtn" class="go-btn">Create trip <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        
      </div>
    </div>

    <script type="module" src="ui.js"></script>
<script type="module" src="script.js"></script>

    <script src="ecosystem.js" defer></script>
    <script src="holiday.js" defer></script>
  </body>

</html>
